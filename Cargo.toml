[package]
name = "tau-rs"
version = "0.1.0"
edition = "2024"
default-run = "tau-rs"

[dependencies]
serde = { version = "1", features = ["derive"] } 
# `preserve_order` keeps JSON object keys in insertion order, like a Python
# dict, so `arguments`/`details` survive a session round trip unchanged.
serde_json = { version = "1", features = ["preserve_order"] }